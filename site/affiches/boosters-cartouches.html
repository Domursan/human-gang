:root { color-scheme: dark; }
html, body { margin: 0; background: #0b0a10; }

.page { width: 1200px; max-width: 100%; margin: 0 auto; padding: 56px 40px 64px; box-sizing: border-box; }

.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 56px 40px; }
.item { display: flex; flex-direction: column; align-items: center; }
.item .cart-box { flex: none; }
.cap { margin-top: 18px; text-align: center; }
.cap-name { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .04em; }
.cap-price { margin: 4px 0 0; font-size: 14px; font-weight: 700; color: #ffd84d; font-variant-numeric: tabular-nums; }
