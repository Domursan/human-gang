<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script>
    /* Anciennes adresses : les pages étaient à plat (/jeux.html), elles sont rangées dans pages/<catégorie>/.
       Ce script doit rester ici, avant le jeu de la 404 et avant la CSP ci-dessous (qui ne s'applique pas à lui).
       Table générée depuis site/pages/ : nom de page -> catégorie. Une adresse /pages/<mauvaise catégorie>/<nom>.html
       est aussi remise à la bonne place. ?query et #hash sont conservés. */
    (function () {
      var CATEGORIE = {
        "admin": "admin", "cartes": "cartes", "collection-a4": "cartes",
        "accueil": "compte", "compte": "compte", "membre": "compte", "messages": "compte",
        "aide": "infos", "assistance": "infos", "legal": "infos", "rejoindre": "infos",
        "calendrier": "irl", "cine": "irl", "citations": "irl", "evenements": "irl", "historique": "irl", "irl": "irl", "playlist": "irl", "recap": "irl", "secret-santa": "irl",
        "blackjack": "jeux", "catan": "jeux", "cluedo": "jeux", "destins": "jeux", "duels": "jeux", "jeux": "jeux", "loup-garou": "jeux", "monopoly": "jeux", "nom-de-code": "jeux", "pictionary": "jeux", "poker": "jeux", "quiz": "jeux", "risk": "jeux", "secret": "jeux", "shadow-hunters": "jeux", "simulateur": "jeux", "uno": "jeux"
      };
      try {
        var segments = location.pathname.split("/");
        var nom = (segments[segments.length - 1] || "").replace(/\.html$/i, "");
        if (!Object.prototype.hasOwnProperty.call(CATEGORIE, nom)) return;
        var cible = "/pages/" + CATEGORIE[nom] + "/" + nom + ".html";
        if (location.pathname === cible) return;
        location.replace(cible + location.search + location.hash);
      } catch (e) { /* pas de redirection : la 404 s'affiche normalement */ }
    })();
  </script>

<body>
  <main class="container e404" id="app">

      <div class="jeu404" aria-describedby="jeu-aide">
        <canvas id="jeu-canvas" class="jeu404-canvas" width="360" height="420" tabindex="0" role="application"
          aria-label="Jeu des paillettes : déplace le chapeau du gang pour attraper les paillettes qui tombent"></canvas>
        <p id="jeu-aide" class="small muted">Souris, doigt ou flèches gauche et droite : déplace le chapeau pour attraper les paillettes. 3 vies : évite les pièges (fausses paillettes violettes, grêlons).</p>
        <div class="jeu404-hud">

          <p>Vies : <span id="jeu-coeurs" aria-hidden="true">♥ ♥ ♥</span> <span class="visually-hidden" id="jeu-vies-txt">3 vies sur 3</span></p>
        </div>
