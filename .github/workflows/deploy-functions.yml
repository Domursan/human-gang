# Déploiement des fonctions edge Supabase, depuis GitHub (aucune installation sur l'ordinateur).
#
# Utilisation : onglet « Actions » du dépôt › « Déployer une fonction » › « Run workflow » › choisir la fonction › « Run workflow ».
# La version déployée est celle de main au moment du clic (avec le dossier _shared/).
#
# Prérequis (une seule fois) : le secret GitHub SUPABASE_ACCESS_TOKEN, un jeton personnel Supabase
# (supabase.com › Account › Access Tokens › Generate new token), ajouté dans Settings › Secrets and variables › Actions.
# Le jeton n'est jamais écrit dans le dépôt ni dans les journaux.
#
# verify_jwt de chaque fonction : voir supabase/functions/DEPLOY.md (repris ci-dessous).
name: Déployer une fonction

on:
  # Envoi sur main qui modifie supabase/functions/a-deployer.txt : déploie les fonctions listées (une par ligne).
  push:
    branches: [main]
    paths: ['supabase/functions/a-deployer.txt']
  workflow_dispatch:
    inputs:
      fonction:
        description: Fonction à déployer
        type: choice
        required: true
        default: hg-notify
        options: [hg-notify, hg-support, hg-birthdays, hg-cron, hg-album, hg-archive, hg-push, hg-discord, hg-calendar, hg-nj-images, toutes]

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zqbdzokyhgavgmqgiwuw
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vérifier le jeton
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Le secret SUPABASE_ACCESS_TOKEN manque (Settings › Secrets and variables › Actions)."
            exit 1
          fi
      - name: Déployer
        run: |
          # Fonctions appelées par les membres connectés : jeton vérifié par Supabase. Les autres (cron, webhooks, Discord) : non.
          jwt() { case "$1" in hg-notify|hg-album|hg-archive) echo "";; *) echo "--no-verify-jwt";; esac; }
          if [ "${{ github.event_name }}" = "push" ]; then
            liste=$(grep -v '^#' supabase/functions/a-deployer.txt | tr -s ' \n' ' ')
          elif [ "${{ inputs.fonction }}" = "toutes" ]; then
            liste="hg-notify hg-support hg-birthdays hg-cron hg-album hg-archive hg-push hg-discord hg-calendar hg-nj-images"
          else
            liste="${{ inputs.fonction }}"
          fi
          for f in $liste; do
            echo "::group::$f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" $(jwt "$f") --use-api
            echo "::endgroup::"
          done
