# Publication du site sur GitHub Pages, à chaque envoi sur main.
#
# À faire UNE fois dans GitHub : Settings > Pages > Source : « GitHub Actions » (et non « Deploy from a branch »).
# Le site publié est construit depuis site/ dans _site/ (outils/build/construire.mjs : JS et CSS regroupés) ;
# seul _site/ est publié : le reste du dépôt (supabase/, outils/, tests/…) ne sort pas.
# site/.nojekyll désactive Jekyll ; site/CNAME garde le domaine humane-gang.com.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une publication en cours n'est jamais interrompue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Textes par défaut du bot : source unique dans supabase/functions/_shared/, lus aussi par l'admin (admin-bot.js)
      - name: Copier les modèles du bot dans le site
        run: cp supabase/functions/_shared/bot-templates.json site/assets/espaces/admin/bot-templates.json
      # Outil de test de l'admin (simulateur de téléphone) : gardé dans le dépôt pour l'usage local, jamais mis en ligne
      - name: Retirer les outils non publiés
        run: rm -f site/pages/jeux/simulateur.html site/assets/espaces/jeux/simulateur.js
      # Construction du site publié (dossier _site/) : JS et CSS regroupés et compressés, site/ reste lisible.
      # Outil : outils/build/construire.mjs (esbuild, voir outils/build/package.json).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer l'outil de construction (esbuild)
        working-directory: outils/build
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
      - name: Construire le site publié (_site/)
        run: node outils/build/construire.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
