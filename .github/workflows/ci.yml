# Contrôles à chaque envoi sur main et à chaque demande de fusion : syntaxe JS, présence des RPC/tables,
# tests de parcours (4 morceaux en parallèle), accessibilité (axe-core) et budget de performance mobile.
# Les tests tournent sur un faux Supabase (tests/fixtures/) : aucun appel à la vraie base, aucune donnée réelle.
#
# Déclencheurs :
# - envoi sur main (la branche en ligne) ;
# - demande de fusion (ouverte, mise à jour, ou étiquette « ci » ajoutée pour relancer) ;
# - passage de nuit sur main à 2 h 17 UTC (3 h 17 à Zurich en hiver, 4 h 17 en été) : détecte ce qui casse sans
#   changement de code (mise à jour de Chromium, police indisponible…) ;
# - bouton « Run workflow » (workflow_dispatch).
# Les branches de travail ne déclenchent rien d'office, pour éviter une avalanche de mails à chaque envoi.
#
# Alerte Discord : seulement pour main (envoi, nuit ou bouton), un message quand main casse et un autre quand il
# repart. Elle utilise le secret GitHub DISCORD_CI_WEBHOOK (adresse d'un webhook de salon Staff) : sans ce secret,
# l'étape ne fait rien. L'adresse n'est jamais écrite dans le dépôt ni dans les journaux (GitHub masque les secrets).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Une nouvelle exécution sur la même demande de fusion annule la précédente (main n'est jamais annulé).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------- Vérifications statiques (sans navigateur) ----------
  verifs:
    name: Vérifications
    # Étiquette ajoutée : on ne relance que pour l'étiquette « ci ».
    if: github.event.action != 'labeled' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntaxe JavaScript
        working-directory: tests
        run: npm run check
      - name: Appels RPC et tables présents dans la base
        working-directory: tests
        run: npm run test:rpc
      - name: Migrations (numéros uniques, appliquer.txt, fonctions internes refermées)
        working-directory: tests
        run: node controles/check-migrations.cjs
      - name: Échappement des gabarits HTML (interpolations sans esc)
        working-directory: tests
        run: node controles/check-echappement.cjs

  # ---------- Bancs SQL des jeux de plateau (PostgreSQL 16 en service, sans navigateur) ----------
  # Reconstruit la base de test (socle, moteurs, fonctions internes fermées par les migrations 165 et 166) puis lance
  # les scénarios t_*.sql. Mêmes scripts que sur un poste : voir tests/bancs/pg-env.sh.
  bancs-plateaux:
    name: Bancs SQL (plateaux)
    if: github.event.action != 'labeled' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Client psql (version 16)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
      - name: Construire la base de test
        working-directory: tests/bancs/plateaux
        run: bash rebuild.sh
      - name: Scénarios SQL des plateaux
        working-directory: tests/bancs/plateaux
        run: bash run.sh

  # ---------- Suite de parcours, en 4 morceaux parallèles ----------
  morceaux:
    name: Tests (morceau ${{ matrix.shard }} / 4)
    if: github.event.action != 'labeled' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        # Sans package-lock.json, on installe sans en créer un (passer à « npm ci » et au cache npm une fois le
        # fichier généré et committé).
        working-directory: tests
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
      - name: Cache de Chromium (Playwright)
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('tests/package.json') }}
      - name: Installer Chromium pour Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Dépendances système de Chromium (navigateur déjà en cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: tests
        run: npx playwright install-deps chromium
      - name: Tests de parcours et de fumée
        working-directory: tests
        shell: bash
        run: |
          set -o pipefail
          node run-all.cjs --shard=${{ matrix.shard }}/4 2>&1 | tee resultats-tests.log
      - name: Signaler les échecs (annotations lisibles sans les journaux)
        if: failure()
        working-directory: tests
        shell: bash
        run: |
          grep -E "en échec|^ECHEC|Error:|TimeoutError|Timeout [0-9]+ms" resultats-tests.log | sort -u | head -40 | while IFS= read -r l; do
            echo "::error title=Tests morceau ${{ matrix.shard }}::${l:0:300}"
          done
      - name: Bilan et captures
        # Toujours déposé : le bilan JSON sert au résumé global ; les captures n'ont que les fausses données des fixtures.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-morceau-${{ matrix.shard }}
          path: tests/shots/
          if-no-files-found: ignore
          retention-days: 14

  # ---------- Accessibilité (axe-core) : mode « signaler » pendant la période d'observation ----------
  # Passer A11Y_MODE à « bloquer » (et retirer continue-on-error) après une semaine sans défaut grave nouveau.
  accessibilite:
    name: Accessibilité (axe-core)
    if: github.event.action != 'labeled' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      A11Y_MODE: signaler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        working-directory: tests
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
      - name: Cache de Chromium (Playwright)
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('tests/package.json') }}
      - name: Installer Chromium pour Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Dépendances système de Chromium (navigateur déjà en cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: tests
        run: npx playwright install-deps chromium
      - name: Contrôle axe-core des pages publiques (390 et 1280 px)
        working-directory: tests
        run: node controles/a11y-pages.cjs
      - name: Bilan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilan-accessibilite
          path: tests/shots/a11y.json
          if-no-files-found: ignore
          retention-days: 14

  # ---------- Budget de performance mobile (Q3) ----------
  performance:
    name: Budget de performance mobile
    if: github.event.action != 'labeled' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        working-directory: tests
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
      - name: Cache de Chromium (Playwright)
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('tests/package.json') }}
      - name: Installer Chromium pour Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Dépendances système de Chromium (navigateur déjà en cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: tests
        run: npx playwright install-deps chromium
      # On mesure le site tel qu'il est publié (_site/, construit comme dans publier-site.yml), pas les sources.
      - name: Installer l'outil de construction (esbuild)
        working-directory: outils/build
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
      - name: Construire le site publié (_site/)
        run: node outils/build/construire.mjs
      - name: Mesure (4G lente simulée, processeur ralenti × 4, 390 px)
        working-directory: tests
        env:
          HG_ROOT: ${{ github.workspace }}/_site
        run: node controles/perf-budget.cjs
      - name: Contrôles du site publié (_site/), build et fumée
        working-directory: tests
        env:
          HG_ROOT: ${{ github.workspace }}/_site
        run: |
          node controles/check-build.cjs
          node controles/smoke.cjs
      - name: Bilan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilan-performance
          path: tests/shots/perf.json
          if-no-files-found: ignore
          retention-days: 14

  # ---------- Résultat global (nom « test » conservé : c'est le contrôle attendu sur les demandes de fusion) ----------
  test:
    name: test
    needs: [verifs, morceaux, accessibilite, performance, bancs-plateaux]
    if: always() && (github.event.action != 'labeled' || github.event.label.name == 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      echecs: ${{ steps.resume.outputs.echecs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les bilans
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: bilans
      - name: Résumé de la CI
        id: resume
        run: node tests/ci-resume.cjs bilans
      - name: Verdict
        # L'accessibilité ne bloque pas pendant la période d'observation (continue-on-error).
        env:
          VERIFS: ${{ needs.verifs.result }}
          MORCEAUX: ${{ needs.morceaux.result }}
          PERF: ${{ needs.performance.result }}
          BANCS: ${{ needs.bancs-plateaux.result }}
        run: |
          echo "Vérifications : $VERIFS · Tests : $MORCEAUX · Performance : $PERF · Bancs SQL : $BANCS"
          [ "$VERIFS" = success ] && [ "$MORCEAUX" = success ] && [ "$PERF" = success ] && [ "$BANCS" = success ]

  # ---------- Alerte Discord (main seulement) ----------
  alerte:
    name: Alerte Discord
    needs: [test]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Prévenir le salon Staff si main casse ou repart
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          RESULTAT: ${{ needs.test.result }}
          ECHECS: ${{ needs.test.outputs.echecs }}
          DECLENCHEUR: ${{ github.event_name }}
          RAPPORT: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "Secret DISCORD_CI_WEBHOOK absent : pas d'alerte."; exit 0; fi
          case "$RESULTAT" in success|failure) ;; *) echo "Exécution $RESULTAT : pas d'alerte."; exit 0;; esac
          # Conclusion de la dernière exécution terminée sur main (avant celle-ci) : on ne prévient qu'au changement.
          avant=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.event != \"pull_request\")][0].conclusion // \"\"" 2>/dev/null || echo "")
          case "$DECLENCHEUR" in schedule) qui="passage de nuit";; push) qui="envoi sur main";; *) qui="lancement manuel";; esac
          if [ "$RESULTAT" = "success" ]; then
            [ "$avant" = "failure" ] || { echo "main va bien (avant : ${avant:-inconnu}) : rien à envoyer."; exit 0; }
            titre="CI repartie sur main"; texte="Tous les contrôles repassent ($qui)."; couleur=1415494
          else
            [ "$avant" = "failure" ] && { echo "main était déjà en échec : un seul message par panne."; exit 0; }
            titre="CI en échec sur main"; texte="${ECHECS:-voir le rapport}, voir les captures ($qui)."; couleur=16658692
          fi
          jq -n --arg t "$titre" --arg d "$texte" --arg u "$RAPPORT" --argjson c "$couleur" \
            '{username: "Humane Gang CI", allowed_mentions: {parse: []}, embeds: [{title: $t, description: $d, url: $u, color: $c}]}' \
            | curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' --data-binary @- "$WEBHOOK" \
            && echo "Alerte envoyée : $titre" || echo "Alerte non envoyée (webhook injoignable)."
