<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Les badges du Humane Gang</title>
<style>
  @page { size: A3 portrait; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0b0a10; }
  :root {
    --bg: #0b0a10;
    --surface: #17151d;
    --surface-2: #211e29;
    --border: #35303f;
    --gold: #e2c77e;
    --raspberry: #9E3543;
    --text: #f4f1ea;
    --muted: #b9b3c4;
    --rb-1: #FE3104; --rb-2: #FCA301; --rb-3: #FBD32D; --rb-4: #159946; --rb-5: #2B5AE2; --rb-6: #4E2398;
  }
  body {
    width: 1123px; height: 1587px; overflow: hidden;
    font-family: Inter, system-ui, "DejaVu Sans", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 85% 4%, rgba(158,53,67,.28), transparent 46%),
      radial-gradient(circle at 6% 96%, rgba(226,199,126,.10), transparent 40%),
      var(--bg);
    position: relative;
  }
  .rainbow {
    position: absolute; left: 0; right: 0; top: 0; height: 8px;
    background: linear-gradient(90deg, var(--rb-1) 0 16.6%, var(--rb-2) 16.6% 33.3%, var(--rb-3) 33.3% 50%, var(--rb-4) 50% 66.6%, var(--rb-5) 66.6% 83.3%, var(--rb-6) 83.3% 100%);
  }
  .page { position: absolute; inset: 8px 0 0 0; padding: 40px 56px 0; }

  /* En-tête */
  header { display: flex; align-items: center; gap: 36px; padding-bottom: 26px; border-bottom: 2px solid var(--border); }
  header img.logo { width: 150px; height: 150px; flex: 0 0 150px; object-fit: contain; image-rendering: pixelated; }
  .kicker { font-family: "DejaVu Sans Mono", "Courier New", monospace; font-size: 15px; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; margin: 0 0 10px; }
  h1 { margin: 0; font-family: "Arial Black", "DejaVu Sans", Impact, sans-serif; font-weight: 900; font-size: 70px; line-height: .92; letter-spacing: -.01em; text-transform: uppercase; }
  h1 .soft { display: block; color: var(--gold); font-size: 44px; margin-top: 8px; letter-spacing: .01em; }
  .intro { margin: 14px 0 0; font-size: 17px; color: var(--muted); line-height: 1.45; }
  .pill {
    display: inline-block; margin-top: 14px; padding: 8px 16px; border-radius: 999px;
    background: var(--gold); color: #1a1407; font-weight: 800; font-size: 17px; letter-spacing: .02em;
  }
  .pill small { font-weight: 700; font-size: 14px; opacity: .85; margin-left: 6px; }

  /* Sections */
  section { margin-top: 20px; }
  .sec-title { display: flex; align-items: baseline; gap: 14px; margin: 0 0 12px; }
  .sec-title h2 { margin: 0; font-family: "Arial Black", "DejaVu Sans", Impact, sans-serif; font-size: 25px; text-transform: uppercase; letter-spacing: .03em; color: var(--text); }
  .sec-title .tag { font-family: "DejaVu Sans Mono", "Courier New", monospace; font-size: 13px; color: var(--gold); letter-spacing: .12em; text-transform: uppercase; }
  .sec-title::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, var(--raspberry), transparent); align-self: center; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .grid.three { grid-template-columns: repeat(3, 1fr); }
  .grid.five { grid-template-columns: repeat(5, 1fr); }
  .grid.five .card { flex-direction: column; min-height: 176px; }
  .grid.five .card h3 { font-size: 15px; }
  .card {
    background: var(--surface); border: 2px solid var(--border); border-radius: 14px;
    padding: 12px; display: flex; gap: 12px; align-items: flex-start; min-height: 112px;
  }
  .card .ico {
    width: 64px; height: 64px; flex: 0 0 64px; border-radius: 10px;
    background: var(--surface-2); display: flex; align-items: center; justify-content: center;
    font-size: 34px; overflow: hidden;
  }
  .card .ico img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  .card h3 { margin: 2px 0 4px; font-size: 16px; font-weight: 800; line-height: 1.15; color: var(--text); }
  .card p { margin: 0; font-size: 13px; line-height: 1.36; color: var(--muted); }
  .card.hot { border-color: var(--raspberry); }

  /* Ancienneté */
  .anc {
    margin-top: 12px; background: var(--surface); border: 2px solid var(--gold); border-radius: 14px; padding: 14px 16px;
  }
  .anc-head { display: flex; gap: 12px; align-items: baseline; margin-bottom: 12px; }
  .anc-head h3 { margin: 0; font-size: 18px; font-weight: 800; }
  .anc-head p { margin: 0; font-size: 13px; color: var(--muted); }
  .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .lvl { text-align: center; background: var(--surface-2); border-radius: 12px; padding: 10px 6px 10px; }
  .lvl img { width: 70px; height: 70px; object-fit: contain; image-rendering: pixelated; display: block; margin: 0 auto 6px; }
  .lvl b { display: block; font-size: 15px; font-weight: 800; }
  .lvl span { display: block; font-size: 13px; color: var(--gold); font-weight: 700; margin-top: 2px; }

  footer {
    position: absolute; left: 56px; right: 56px; bottom: 34px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 2px solid var(--border); padding-top: 14px;
    font-size: 15px; color: var(--muted);
  }
  footer strong { color: var(--text); }
  footer .mono { font-family: "DejaVu Sans Mono", "Courier New", monospace; color: var(--gold); letter-spacing: .08em; }
</style>
</head>
<body data-affiche="badges">
<div class="rainbow"></div>
<div class="page">

  <header>
    <img class="logo" src="../assets/img/logo-512.webp" alt="Logo Humane Gang">
    <div>
      <p class="kicker">Humane Gang · Guide des badges</p>
      <h1>Les badges du<span class="soft">Humane Gang</span></h1>
      <p class="intro"><span id="nb-badges">17</span> badges à décrocher en participant à la vie du gang, du Secret Santa aux soirées.</p>
      <span class="pill">+<span data-cfg="cartes.rewards.badge">500</span> Paillettes par badge</span>
    </div>
  </header>

  <!-- Les sections (Secret Santa, Sorties IRL, Fidélité, Communauté, Événements) sont construites par affiches.js à partir de hg_badges. -->
  <div id="sections"></div>

</div>

<footer>
  <span><strong>Attribués automatiquement toutes les heures.</strong></span>
  <span class="mono">+<span data-cfg="cartes.rewards.badge">500</span> PAILLETTES / BADGE</span>
</footer>
<script type="module" src="affiches.js"></script>
</body>
</html>
